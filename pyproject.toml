[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "modalityops"
version = "0.1.0"
description = "Local-first synchronization and quality assurance for multimodal recordings"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["numpy>=2.1,<3", "scipy>=1.14,<2", "pydantic>=2.10,<3"]

[project.optional-dependencies]
api = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1"]
media = ["av>=14,<19", "mne>=1.9,<2"]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[project.scripts]
modalityops = "modalityops.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
